name: Publish to AUR

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  aur:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_branch, '-')
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Extract version
        id: version
        run: |
          TAG="${{ github.event.workflow_run.head_branch }}"
          echo "pkgver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Stage PKGBUILD
        env:
          PKGVER: ${{ steps.version.outputs.pkgver }}
          REPO: ${{ github.repository }}
        run: |
          SOURCE_URL="https://github.com/${REPO}/archive/refs/tags/v${PKGVER}.tar.gz"
          SHA256=$(curl -sL "$SOURCE_URL" | sha256sum | cut -d' ' -f1)

          cp packaging/aur/cliamp-jarmen423/PKGBUILD .
          sed -i \
            -e "s/^pkgver=.*/pkgver=${PKGVER}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "/^sha256sums=/s/'[0-9a-f]\{64\}'/'${SHA256}'/" \
            PKGBUILD

          cat PKGBUILD

      - name: Generate .SRCINFO
        run: |
          docker run --rm -v "$PWD/PKGBUILD:/PKGBUILD:ro" archlinux:base bash -c \
            'pacman -Sy --noconfirm pacman-contrib >&2 && cp /PKGBUILD /tmp/ && cd /tmp && chown nobody PKGBUILD && runuser -u nobody -- makepkg --printsrcinfo' > .SRCINFO

          cat .SRCINFO

      - name: Publish to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          PKGVER: ${{ steps.version.outputs.pkgver }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t rsa,ecdsa,ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

          # Clone AUR repo (creates the package on first push)
          git clone ssh://aur@aur.archlinux.org/cliamp-jarmen423.git aur-repo
          cd aur-repo

          git config user.name "$AUR_USERNAME"
          git config user.email "$AUR_EMAIL"

          # Copy PKGBUILD and .SRCINFO
          cp ../PKGBUILD ../.SRCINFO .

          # Commit and push
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update to v${PKGVER}"
            git push
          fi
